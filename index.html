<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amir Ali | Contact</title>
    <!-- لود کردن فونت و آیکون‌ها -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            /* پس زمینه گرادیان تیره و شیک */
            background: linear-gradient(135deg, #1e1e2f 0%, #111119 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            padding: 20px;
        }

        .card {
            /* افکت شیشه‌ای (Glassmorphism) */
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .avatar {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            font-weight: 600;
            box-shadow: 0 8px 20px rgba(168, 85, 247, 0.4);
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        p {
            font-size: 14px;
            color: #a1a1aa;
            margin-bottom: 30px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px;
            border-radius: 14px;
            text-decoration: none;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .btn i {
            font-size: 20px;
        }

        /* استایل دکمه‌ها با رنگ‌های اختصاصی */
        .btn-phone {
            background: rgba(255, 255, 255, 0.1);
        }
        .btn-phone:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-3px);
        }

        .btn-telegram {
            background: #229ED9;
        }
        .btn-telegram:hover {
            background: #1e8bc3;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(34, 158, 217, 0.3);
        }

        .btn-instagram {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        }
        .btn-instagram:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(220, 39, 67, 0.3);
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #71717a;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- حرف اول اسم شما در آواتار -->
        <div class="avatar">A</div>
        
        <h1>Amir Ali</h1>
        <p>Digital Business Card</p>

        <div class="links">
            <!-- دکمه تماس -->
            <a href="tel:09905754550" class="btn btn-phone">
                <i class="fas fa-phone-alt"></i>
                Call Me
            </a>

            <!-- دکمه تلگرام -->
            <a href="https://t.me/Amir_ali194" target="_blank" class="btn btn-telegram">
                <i class="fab fa-telegram-plane"></i>
                Telegram
            </a>

            <!-- دکمه اینستاگرام -->
            <a href="https://instagram.com/amir_zam01" target="_blank" class="btn btn-instagram">
                <i class="fab fa-instagram"></i>
                Instagram
            </a>
        </div>

        <div class="footer">
            Scan my NFC tag to connect
        </div>
    </div>

</body>
</html>
